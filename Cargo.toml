[workspace]
resolver = "3"
members = ["crates/minipaw", "crates/minipaw-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deepso7/minipaw"
authors = ["Deepso"]

[workspace.dependencies]
minipaw = { path = "crates/minipaw", version = "0.1.0" }
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3"
getrandom = "0.4"
log = "0.4"
minip2p-rs = { version = "0.7.5", features = ["nat"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
# Safe syscall wrappers (euid, open flags) for identity file checks; already
# in the tree through minip2p.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
# Handling SIGHUP for `-q` (ssh hangs up its ProxyCommand as it exits);
# already in the tree through crossterm.
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

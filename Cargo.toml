[workspace]
resolver = "3"
members = ["crates/minipaw", "crates/minipaw-cli"]
exclude = ["spike/russh-flow"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deepso7/minipaw"
authors = ["Deepso"]

[workspace.dependencies]
minipaw = { path = "crates/minipaw", version = "0.1.2" }
base64 = "0.23"
# The buffer type russh-sftp parses packets from; already in the tree
# through tokio.
bytes = { version = "1", default-features = false }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3"
getrandom = "0.4"
# Deriving the SSH host key seed; hkdf's hmac and sha2 are already in the
# tree through minip2p.
hkdf = "0.13"
log = "0.4"
minip2p-rs = { version = "0.10.1", features = ["nat"] }
# PTYs for `serve --ssh`: a non-blocking master registered with tokio, and a
# Command that does setsid and TIOCSCTTY itself, so no unsafe here.
pty-process = { version = "0.5", features = ["async"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
# Safe syscall wrappers (euid, open flags) for identity file checks; already
# in the tree through minip2p.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
# The built-in SSH server of `serve --ssh`. Pinned: its flow control and
# channel lifecycle are relied on as they are (docs/plans/builtin-ssh.md).
# ring only, so no aws-lc-rs, flate2 or rsa.
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
# SFTP for `serve --ssh`: its protocol types and server Handler trait only,
# under our own supervised loop. Pinned like russh. Its russh dependency is
# a dev-dependency, so it brings no second russh or crypto stack.
russh-sftp = "=3.0.1"
sha2 = { version = "0.11", default-features = false }
# Handling SIGHUP for `-q` (ssh hangs up its ProxyCommand as it exits);
# already in the tree through crossterm.
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time", "macros"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# The serving account's passwd entry (name, home, shell) for `serve --ssh`.
uzers = { version = "0.12", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The binaries attached to GitHub releases (.github/workflows/release.yml).
[profile.release]
lto = true
codegen-units = 1
strip = true

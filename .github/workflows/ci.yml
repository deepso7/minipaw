name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs everything, macOS end-to-end checks included, on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The end-to-end checks run against the hosted relay. `resume` needs a
  # local relay with circuit limits, so it is skipped here.
  RELAY: /dns/relay.minip2p.com/udp/19876/quic-v1/p2p/12D3KooWNAHhp6rp11SvCDA84zua3hhEYTLNjgKmEDmt1BddtLdf

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: SDK has no UI dependencies
        run: |
          deps=$(cargo tree -p minipaw -e normal --prefix none)
          if grep -E '^(clap|ratatui|crossterm|ctrlc) ' <<<"$deps"; then
            echo "::error::the minipaw crate must not depend on UI crates"
            exit 1
          fi
      - name: SDK packages for crates.io
        run: cargo package -p minipaw --no-verify --allow-dirty
      - name: CLI builds without the SSH server
        run: cargo build -p minipaw-cli --no-default-features

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Unit tests, and the release binaries the end-to-end checks share.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      E2E: ${{ matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace
      - name: Build for the end-to-end checks
        if: env.E2E == 'true'
        run: |
          cargo build --release -p minipaw-cli --bin minipaw
          cargo build --release -p minipaw --example squat
      - if: env.E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: |
            target/release/minipaw
            target/release/examples/squat
          if-no-files-found: error
          retention-days: 1

  # The end-to-end checks, split four ways since most of their time is
  # spent waiting. macOS runners cannot hole-punch, so there every check
  # goes through the relay and they take longest: pull requests skip them.
  e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: e2e-${{ matrix.os }}
          path: target/release
      # Artifacts do not keep file modes.
      - run: chmod +x target/release/minipaw target/release/examples/squat
      - name: End-to-end checks
        run: scripts/check.sh
        env:
          NO_BUILD: "1"
          SHARD: ${{ matrix.shard }}/4
          SHOW_LOGS: "1"

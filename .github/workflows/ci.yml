name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The end-to-end checks run against the hosted relay. `resume` needs a
  # local relay with circuit limits, so it is skipped here.
  RELAY: /dns/relay.minip2p.com/udp/19876/quic-v1/p2p/12D3KooWNAHhp6rp11SvCDA84zua3hhEYTLNjgKmEDmt1BddtLdf

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: SDK has no UI dependencies
        run: |
          deps=$(cargo tree -p minipaw -e normal --prefix none)
          if grep -E '^(clap|ratatui|crossterm|ctrlc) ' <<<"$deps"; then
            echo "::error::the minipaw crate must not depend on UI crates"
            exit 1
          fi
      - name: SDK packages for crates.io
        run: cargo package -p minipaw --no-verify --allow-dirty

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace
      - name: End-to-end checks
        run: scripts/check.sh
        env:
          SHOW_LOGS: "1"

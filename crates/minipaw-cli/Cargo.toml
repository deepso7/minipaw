[package]
name = "minipaw-cli"
description = "netcat between two machines over minip2p: QUIC, relayed bootstrap, hole-punched direct paths"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "minipaw"
path = "src/main.rs"
doc = false

[features]
default = ["ssh-server"]
# `serve --ssh`: a built-in SSH server (Unix only).
ssh-server = ["dep:russh", "dep:russh-sftp", "dep:bytes", "dep:tokio", "dep:tokio-util", "dep:pty-process", "dep:rustix", "dep:uzers"]

[dependencies]
minipaw.workspace = true
clap.workspace = true
ctrlc.workspace = true
log.workspace = true
ratatui.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
pty-process = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
uzers = { workspace = true, optional = true }

[target.'cfg(unix)'.dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

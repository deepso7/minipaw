[package]
name = "minipaw"
description = "Pipe bytes between two machines peer to peer over minip2p: QUIC, relayed bootstrap, hole-punched direct paths"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["p2p", "netcat", "quic", "hole-punching", "relay"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
base64.workspace = true
getrandom.workspace = true
hkdf.workspace = true
log.workspace = true
minip2p-rs.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# Probing whether a test socket's send buffer is full.
rustix = { workspace = true, features = ["net"] }

[lints]
workspace = true
